services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-task_tracker}
      MYSQL_USER: ${DB_USER:-task_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      NODE_ENV: production
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/init-db.js && node scripts/seed-demo.js && node src/server.js"]
volumes:
  mysql_data:
