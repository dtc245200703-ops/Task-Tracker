# Mẫu cho máy chủ Linux. Cần thay tên miền và đường dẫn chứng chỉ thật.
server {
    listen 80;
    server_name task.example.edu.vn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name task.example.edu.vn;
    ssl_certificate /etc/letsencrypt/live/task.example.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task.example.edu.vn/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
